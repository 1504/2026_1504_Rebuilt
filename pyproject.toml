#
# Use this configuration file to control what RobotPy packages are installed
# on your RoboRIO
#

[tool.robotpy]
# Version of robotpy this project depends on
robotpy_version = "2026.2.1.1"

[tool.robotpy.pyfrc]
# specifies the method of testing
isolated = true

# Which extra RobotPy components should be installed
# -> equivalent to `pip install robotpy[extra1, ...]
components  = [
    # "all"
    # "apriltag"
    "commands2",
    # "cscore"
    "navx",
    "pathplannerlib",
    # "phoenix5"
    "phoenix6",
    # "playingwithfusion"
    "rev"
    # "romi"
    # "sim"
    # "xrp"
]

# Other pip packages to install
requires = ["pynetworktables", "pynetconsole", "robotpy-navx", "robotpy-rev", "phoenix6", "robotpy-apriltag", "robotpy-pathplannerlib"]
